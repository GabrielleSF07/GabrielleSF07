
name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate purple snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GabrielleSF07
          outputs: |
            dist/github-snake.svg?color_snake=%23DA70D6&color_dots=%2316141C,%234B2067,%237B2CBF,%23B565D9,%23E0AAFF

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
